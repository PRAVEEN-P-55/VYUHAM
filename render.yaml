services:
  - type: web
    name: vyuham-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && python scripts/seed_from_datasets.py && python scripts/make_demo_fir.py --all"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: '["*"]'
